name: branch-cleanup

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: read

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Borrar ramas de PRs ya mergeados
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin --prune

          PROTECTED_REGEX="^(main|master|develop)$"

          # Solo se borran ramas cuyo PR ya fue mergeado (no cualquier
          # rama cuyo commit sea ancestro de main: eso incluiria ramas
          # nuevas recien creadas desde main que todavia no tienen commits
          # propios, como las de feature en progreso).
          gh pr list --state merged --limit 200 --json headRefName --jq '.[].headRefName' | sort -u | while read -r branch; do
            [ -z "$branch" ] && continue

            if echo "$branch" | grep -Eq "$PROTECTED_REGEX"; then
              continue
            fi

            if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              continue
            fi

            open_pr=$(gh pr list --state open --head "$branch" --json number --jq 'length')
            if [ "$open_pr" != "0" ]; then
              echo "Skip $branch: tiene un PR abierto"
              continue
            fi

            echo "Borrando rama de PR ya mergeado: $branch"
            git push origin --delete "$branch" || true
          done
