name: branch-cleanup

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  delete-merged-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Borrar ramas remotas ya mergeadas a main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git fetch origin --prune

          DEFAULT_BRANCH="main"
          PROTECTED_REGEX="^(main|master|develop)$"

          for branch in $(git branch -r --merged "origin/$DEFAULT_BRANCH" | sed 's/origin\///' | grep -v '\->' | grep -v '^HEAD$'); do
            if echo "$branch" | grep -Eq "$PROTECTED_REGEX"; then
              continue
            fi

            open_pr=$(gh pr list --state open --head "$branch" --json number --jq 'length')
            if [ "$open_pr" != "0" ]; then
              echo "Skip $branch: tiene un PR abierto"
              continue
            fi

            echo "Borrando rama ya mergeada: $branch"
            git push origin --delete "$branch" || true
          done
